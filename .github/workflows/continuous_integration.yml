name: "Continuous Integrations"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/lint-plugin@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}

  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/build-plugin@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}

  verify-plugin-android:
    needs: ['lint', 'build']
    runs-on: 'xcode-27'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 'Setup Tools'
        uses: ionic-team/capacitor-actions/setup-tools@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}
      - name: 'Verify Android'
        working-directory: .
        run: npm run verify:android

  verify-plugin-ios:
    needs: ['lint', 'build']
    runs-on: 'xcode-27'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 'Setup Tools'
        uses: ionic-team/capacitor-actions/setup-tools@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}
      - name: 'Verify iOS'
        working-directory: .
        run: npm run verify:ios
