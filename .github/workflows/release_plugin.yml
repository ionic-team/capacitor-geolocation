name: "Release Plugin"

on:
  workflow_dispatch:
  release:
    types: published

permissions:
    contents: write
    issues: write
    deployments: write
    id-token: write # to enable use of OIDC for npm provenance and trusted publishing

jobs:
  lint:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/lint-plugin@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}

  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/build-plugin@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}

  release:
    needs: [ 'lint', 'build']
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/release-plugin-npm@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}
          npm-tag: ${{ github.ref_name == 'next' && 'next' || 'latest' }}
