name: "Release Plugin"

on:
  workflow_dispatch:

permissions:
    contents: write
    issues: write
    deployments: write

jobs:
  lint:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/lint-plugin@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}

  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: ionic-team/capacitor-actions/build-plugin@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}

  release-please:
    needs: ['build', 'lint']
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@v1.0.0
        with:
          working-directory: .
          gh-token: ${{ github.token }}
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          config-file: ${{ github.ref_name == 'next' && 'release-please-config-next.json' || 'release-please-config.json' }}
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
